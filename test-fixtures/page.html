<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unloader test page</title>
    <style>
      body { max-width: 44rem; margin: 3rem auto; padding: 0 1rem; font: 16px/1.5 system-ui, sans-serif; }
      textarea { display: block; width: 100%; min-height: 8rem; margin: 1rem 0; }
      button { font: inherit; padding: .5rem .75rem; }
      iframe { width: 100%; height: 12rem; border: 1px solid #aaa; }
    </style>
  </head>
  <body>
    <h1>Unloader test page</h1>
    <p id="identity"></p>
    <label for="draft">Draft text</label>
    <textarea id="draft" placeholder="Type unsaved work here"></textarea>
    <div id="editable" contenteditable="true" aria-label="Editable content">Editable content</div>
    <p><button id="play" type="button">Play audio</button> <button id="stop" type="button">Stop audio</button></p>
    <div id="frame"></div>
    <script>
      const params = new URLSearchParams(location.search);
      document.querySelector("#identity").textContent = location.pathname + location.search;
      const draft = document.querySelector("#draft");
      draft.addEventListener("input", () => { window.__draftChanged = true; });
      if (params.has("editing")) {
        draft.value = "Unsaved test text";
        draft.focus();
        draft.dispatchEvent(new Event("input", { bubbles: true }));
      }
      if (params.has("iframe")) {
        const iframe = document.createElement("iframe");
        iframe.src = "/page/iframe-child?editing=1";
        document.querySelector("#frame").append(iframe);
      }
      let audio;
      document.querySelector("#play").addEventListener("click", async () => {
        const rate = 8000;
        const seconds = 2;
        const samples = rate * seconds;
        const wav = new ArrayBuffer(44 + samples * 2);
        const view = new DataView(wav);
        const write = (offset, value) => [...value].forEach((char, index) => view.setUint8(offset + index, char.charCodeAt(0)));
        write(0, "RIFF"); view.setUint32(4, wav.byteLength - 8, true);
        write(8, "WAVE"); write(12, "fmt "); view.setUint32(16, 16, true);
        view.setUint16(20, 1, true); view.setUint16(22, 1, true);
        view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true);
        view.setUint16(32, 2, true); view.setUint16(34, 16, true);
        write(36, "data"); view.setUint32(40, samples * 2, true);
        for (let index = 0; index < samples; index++) {
          view.setInt16(44 + index * 2, Math.sin(index * Math.PI * 2 * 440 / rate) * 6000, true);
        }
        audio?.pause();
        audio = new Audio(URL.createObjectURL(new Blob([wav], { type: "audio/wav" })));
        audio.loop = true;
        await audio.play();
      });
      document.querySelector("#stop").addEventListener("click", () => audio?.pause());
      const megabytes = Math.min(16, Math.max(0, Number(params.get("mb") || 0)));
      if (megabytes) {
        window.__memoryFixture = new Uint8Array(megabytes * 1024 * 1024);
        for (let offset = 0; offset < window.__memoryFixture.length; offset += 4096) {
          window.__memoryFixture[offset] = offset % 251;
        }
      }
      window.__fixtureReady = true;
    </script>
  </body>
</html>
